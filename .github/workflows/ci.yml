# Runs on every push and pull request. Free on GitHub (no paid services).
# Proves: lint, types, design tokens and wording; unit tests; every database rule
# against real PostgreSQL + PostGIS; the Cloudflare build and its size budget; and that
# the admin pages refuse everyone who shouldn't get in.
name: CI

on:
  push:
    # Asking for a look at the site watch (watch-check.yml) isn't a change to the site.
    paths-ignore: ['.github/watch-check.txt', '.github/workflows/watch-check.yml']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A throwaway database inside this job only; not a real credential.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint, types, design tokens, wording
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Database checks (migrations + rules)
        run: npm run test:db
      - name: Cloudflare build
        run: npm run build
      - name: Site watch build
        run: npx wrangler deploy --dry-run --config wrangler.watch.jsonc --outdir .watch-build
      - name: Size budget (free plan)
        run: npm run size

  # Sign-in, admin access and claiming, tested for real (E §1.7): a local copy of Supabase's
  # open-source sign-in server, a pretend email service, a throwaway database and the built
  # site. tests/e2e/admin-access.mjs tries every way into the admin pages without
  # permission; tests/e2e/claiming.mjs covers emailed codes and claims. All values here are
  # throwaway and local to this job; no real accounts or secrets.
  admin-access:
    name: Sign-in, admin and claiming tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/localites_e2e_test
      E2E_AUTH_DATABASE_URL: postgres://postgres:postgres@localhost:5432/localites_e2e_test?search_path=auth&sslmode=disable
      E2E_AUTH_JWT_SECRET: e2e-throwaway-secret-not-a-real-credential-0123
      E2E_APP_PASSWORD: e2e-local-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/cache@v4
        with:
          path: .e2e/auth-server
          key: auth-server-${{ hashFiles('scripts/e2e/build-auth-server.sh') }}
      - run: npm ci
      - name: Build the local sign-in server
        run: bash scripts/e2e/build-auth-server.sh .e2e/auth-server
      - name: Prepare a throwaway database
        run: node scripts/e2e/prepare-db.mjs
      - name: Start the pretend email service and the sign-in server
        run: |
          nohup node scripts/e2e/mail-server.mjs > mail-server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:8787/health && break; sleep 0.5; done
          . scripts/e2e/env.sh
          .e2e/auth-server migrate
          nohup .e2e/auth-server serve > auth-server.log 2>&1 &
      - name: Build and start the site
        run: |
          printf 'CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE=postgres://app_server:%s@localhost:5432/localites_e2e_test\nSUPABASE_AUTH_URL=http://127.0.0.1:9999\n' "$E2E_APP_PASSWORD" > .env
          # A throwaway activity key, made fresh for this run only, so counting is on (ADR-030).
          printf 'ACTIVITY_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          # The "are you human" check, pointed at the pretend checker (tests/e2e/human-check.mjs).
          printf 'TURNSTILE_SITE_KEY=e2e-turnstile-site-key\nTURNSTILE_SECRET_KEY=e2e-turnstile-secret-local-only\nTURNSTILE_VERIFY_URL=http://127.0.0.1:8787/turnstile/siteverify\n' >> .env
          # The site's own emails, sent to the pretend email service so the tests can read them (tests/e2e/event-plans.mjs).
          printf 'RESEND_API_KEY=e2e-email-key-local-only\nEMAIL_API_URL=http://127.0.0.1:8787/emails\n' >> .env
          # Emails about new messages wait 2 seconds here, not 20, so the tests don't wait long (tests/e2e/messages.mjs).
          printf 'MESSAGE_EMAIL_WAIT_SECONDS=2\n' >> .env
          # Guests' invitation links (Stage 4): a throwaway key for the test run.
          printf 'INVITE_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          # Business photos, stored in the pretend file storage (tests/e2e/photos.mjs).
          printf 'PHOTO_KEY_ID=e2e-photo-key\nPHOTO_SECRET=e2e-photo-secret-local-only\nPHOTO_REGION=local\nPHOTO_STORAGE_URL=http://127.0.0.1:8787/storage/v1\n' >> .env
          npm run build
          nohup npx vite preview --port 4173 --strictPort > site.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:9999/health && curl -sf -o /dev/null http://localhost:4173/ && exit 0
            sleep 1
          done
          echo "The site or sign-in server didn't start"; exit 1
      # The browser for the look checks (tests/e2e/look.mjs), at the version package.json pins.
      - name: Browser for the look checks
        run: npx playwright install --with-deps chromium
      - name: Sign-in, admin and claiming tests
        run: npm run test:e2e
      - name: Logs (only if something failed)
        if: failure()
        run: tail -n 80 auth-server.log site.log mail-server.log || true
      - name: Screenshots of pages that failed the look checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: look-shots
          path: look-shots/
          retention-days: 7
          if-no-files-found: ignore

  # Keeps the Supabase TEST project (localites-test) in step with this branch, only
  # after every check above has passed. Uses the encrypted repository secret
  # SUPABASE_TEST_ADMIN_URL, which only the product owner enters. Never production:
  # production gets its own manual, approved step before launch.
  test-database:
    name: Update the test database
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_ADMIN_URL: ${{ secrets.SUPABASE_TEST_ADMIN_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: |
          if [ -z "$DATABASE_ADMIN_URL" ]; then
            echo "::notice::SUPABASE_TEST_ADMIN_URL isn't set yet, so the test database wasn't updated."
            exit 0
          fi
          npm run db:migrate
      - name: Load fake test businesses
        if: env.DATABASE_ADMIN_URL != ''
        run: npm run db:seed:test -- --supabase-test-project
      - name: Load the 28 researched test businesses as drafts (once)
        if: env.DATABASE_ADMIN_URL != ''
        run: npm run db:import:test-businesses -- --supabase-test-project

  # Puts the website live on Cloudflare, last: only after every check and test above has
  # passed and the test database has its changes, so the new website never looks for a
  # database change that isn't there yet. Uses two encrypted repository secrets the
  # product owner enters (PO-17): CLOUDFLARE_API_TOKEN (allowed to deploy Workers only)
  # and CLOUDFLARE_ACCOUNT_ID. Until they're set, this says so and changes nothing.
  deploy:
    name: Put the website live
    needs: [checks, admin-access, test-database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/event-discovery-architecture-dz0qgf'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Guests' invitation links (Stage 4) are made from INVITE_KEY. It's made here once, as a
      # random value nobody sees, and kept in Cloudflare as a Secret; never replaced (every link
      # already sent would stop working). Only a clear answer from Cloudflare (a list without
      # it) makes one; anything else changes nothing and the deploy goes ahead.
      - name: Make the invitation key, once
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          names=$(npx wrangler secret list --format json 2>/dev/null) || { echo "::warning::Couldn't list the site's secrets; the invitation key wasn't checked."; exit 0; }
          if ! node -e 'const l=JSON.parse(process.argv[1]); if (!Array.isArray(l)) process.exit(1)' "$names" 2>/dev/null; then
            echo "::warning::Cloudflare's list of secrets wasn't clear; the invitation key wasn't checked."; exit 0
          fi
          if node -e 'process.exit(JSON.parse(process.argv[1]).some((s) => s.name === "INVITE_KEY") ? 0 : 1)' "$names"; then
            echo "The invitation key is already set."
          else
            openssl rand -hex 32 | tr -d '\n' | npx wrangler secret put INVITE_KEY
            echo "The invitation key was made."
          fi
      - name: Build and deploy to Cloudflare
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID isn't set yet (PO-17), so this run didn't deploy."
            exit 0
          fi
          npm run deploy
      - name: Check the live site answers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          site=$(node -e "const fs=require('fs');const t=fs.readFileSync('wrangler.jsonc','utf8');console.log(t.match(/\"SITE_URL\":\s*\"([^\"]+)\"/)[1])")
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o health.json -w '%{http_code}' "$site/api/health" || true)
            if [ "$code" = "200" ]; then echo "Live site is healthy:"; cat health.json; exit 0; fi
            sleep 10
          done
          echo "::error::The live site's health check answered $code after deploying."; cat health.json || true; exit 1
      # The site watch (workers/watch.ts, runbook F §8): its own small Worker, put live after
      # the site. It emails the team when the site is down (once PO-19 gives it an email key).
      - name: Put the site watch live
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy --config wrangler.watch.jsonc
