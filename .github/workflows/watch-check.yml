# Listens to the site watch (localites-watch, runbook F §8) for about 6 minutes and prints
# what it did: each scheduled look, its log lines ("site watch: ...") and any error. Uses the
# deploy key (PO-17), read-only here. Runs when .github/watch-check.txt changes, or on demand.
# Prints no secrets: the watch's log lines never contain its key or email text.
name: Check the site watch

on:
  push:
    paths: ['.github/watch-check.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listen:
    name: Listen to the site watch for 6 minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Its versions (adding a secret makes a new one)
        run: npx wrangler deployments list --name localites-watch 2>&1 | tail -20 || true
      - name: The schedules Cloudflare has, and its record of past scheduled runs
        run: |
          api=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          for w in localites-watch localites; do
            echo "== $w schedules:"
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/workers/scripts/$w/schedules" |
              node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log(j.success?JSON.stringify(j.result):"refused: "+JSON.stringify(j.errors))})'
          done
          since=$(date -u -d '-26 hours' +%FT%TZ)
          query='query($a:String!,$since:Time!){viewer{accounts(filter:{accountTag:$a}){workersInvocationsScheduled(limit:50,filter:{datetime_geq:$since},orderBy:[datetime_DESC]){scriptName cron status datetime}}}}'
          echo "== scheduled runs since $since (newest first):"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' https://api.cloudflare.com/client/v4/graphql \
            -d "$(node -e 'console.log(JSON.stringify({query:process.argv[1],variables:{a:process.argv[2],since:process.argv[3]}}))' "$query" "$CLOUDFLARE_ACCOUNT_ID" "$since")" |
            node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);if(j.errors&&j.errors.length){console.log("refused: "+j.errors.map(e=>e.message).join("; "));return}const r=j.data.viewer.accounts[0].workersInvocationsScheduled;console.log(r.length+" runs");for(const x of r)console.log(`${x.datetime} ${x.scriptName} ${x.cron} ${x.status}`)})'
      - name: Listening works (a quick check on the site itself)
        run: |
          (timeout 25 npx wrangler tail localites --format json > site-tail.jsonl 2> site-tail.err || true) &
          sleep 12
          curl -s -o /dev/null "https://localites.supportlocalites.workers.dev/api/health"
          wait
          echo "Events heard from the site: $(grep -c . site-tail.jsonl || true)"; grep -v '^\s*$' site-tail.err | tail -5 || true
      - name: Listen
        run: |
          timeout 390 npx wrangler tail localites-watch --format json > tail.jsonl 2> tail.err || true
          echo "Events heard: $(grep -c . tail.jsonl || true)"
          node -e '
            const lines = require("fs").readFileSync("tail.jsonl", "utf8").split("\n").filter(Boolean);
            for (const l of lines) {
              let e; try { e = JSON.parse(l); } catch { continue; }
              const when = new Date(e.eventTimestamp ?? Date.now()).toISOString();
              const kind = e.event?.cron ? `scheduled (${e.event.cron})` : e.event?.request ? "request" : "event";
              console.log(`${when} ${kind} outcome=${e.outcome}`);
              for (const log of e.logs ?? []) console.log(`   ${log.level}: ${[].concat(log.message).join(" ")}`);
              for (const ex of e.exceptions ?? []) console.log(`   EXCEPTION ${ex.name}: ${ex.message}`);
            }'
          echo "--- wrangler said:"; grep -v '^\s*$' tail.err | tail -15 || true
